<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1em;
    }
    .form-group {
      margin-bottom: 1em;
    }
    label {
      display: block;
      margin-bottom: 0.3em;
      font-weight: 600;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.5em;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      padding: 0.6em 1.5em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 0.5em;
    }
    .btn-save {
      background: #2196F3;
      color: white;
    }
    .btn-test {
      background: #4CAF50;
      color: white;
    }
    .status {
      margin-top: 1em;
      padding: 0.8em;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }
    .status.loading {
      background: #e3f2fd;
      color: #1565c0;
      display: block;
    }
    .info {
      margin-bottom: 1.5em;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1 class="homey-title" data-i18n="settings.credentials.title"></h1>
  <p class="info" data-i18n="settings.credentials.intro"></p>

  <div class="form-group">
    <label for="username" data-i18n="settings.credentials.email"></label>
    <input type="text" id="username" autocomplete="email" />
  </div>

  <div class="form-group">
    <label for="password" data-i18n="settings.credentials.password"></label>
    <input type="password" id="password" autocomplete="current-password" />
  </div>

  <div>
    <button class="btn-save" id="btn-save" data-i18n="settings.credentials.save"></button>
    <button class="btn-test" id="btn-test" data-i18n="settings.credentials.test"></button>
  </div>

  <div class="status" id="status"></div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready();

      var usernameEl = document.getElementById('username');
      var passwordEl = document.getElementById('password');
      var statusEl = document.getElementById('status');

      usernameEl.placeholder = Homey.__('settings.credentials.email_placeholder');
      passwordEl.placeholder = Homey.__('settings.credentials.password_placeholder');

      // Load existing credentials
      Homey.get('username', function(err, value) {
        if (!err && value) usernameEl.value = value;
      });
      Homey.get('password', function(err, value) {
        if (!err && value) passwordEl.value = value;
      });

      function setStatus(message, type) {
        statusEl.className = 'status ' + type;
        statusEl.textContent = message;
      }

      document.getElementById('btn-save').addEventListener('click', function() {
        var username = usernameEl.value.trim();
        var password = passwordEl.value.trim();

        if (!username || !password) {
          setStatus(Homey.__('settings.credentials.missing'), 'error');
          return;
        }

        Homey.set('username', username, function(err) {
          if (err) {
            setStatus(Homey.__('settings.credentials.save_failed', { error: err.message }), 'error');
            return;
          }
          Homey.set('password', password, function(err2) {
            if (err2) {
              setStatus(Homey.__('settings.credentials.save_failed', { error: err2.message }), 'error');
              return;
            }
            setStatus(Homey.__('settings.credentials.saved'), 'success');
          });
        });
      });

      document.getElementById('btn-test').addEventListener('click', function() {
        var username = usernameEl.value.trim();
        var password = passwordEl.value.trim();

        if (!username || !password) {
          setStatus(Homey.__('settings.credentials.missing'), 'error');
          return;
        }

        setStatus(Homey.__('settings.credentials.testing'), 'loading');

        Homey.api('POST', '/test-credentials', { username: username, password: password }, function(err, result) {
          if (err) {
            setStatus(Homey.__('settings.credentials.test_fail', { error: err.message || err }), 'error');
          } else {
            setStatus(Homey.__('settings.credentials.test_success', { count: result.deviceCount }), 'success');
          }
        });
      });
    }
  </script>
</body>
</html>
