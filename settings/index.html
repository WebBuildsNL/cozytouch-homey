<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1em;
    }
    .form-group {
      margin-bottom: 1em;
    }
    label {
      display: block;
      margin-bottom: 0.3em;
      font-weight: 600;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.5em;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      padding: 0.6em 1.5em;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 0.5em;
    }
    .btn-save {
      background: #2196F3;
      color: white;
    }
    .btn-test {
      background: #4CAF50;
      color: white;
    }
    .status {
      margin-top: 1em;
      padding: 0.8em;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }
    .status.loading {
      background: #e3f2fd;
      color: #1565c0;
      display: block;
    }
    .info {
      margin-bottom: 1.5em;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <p class="info">
    Enter your Atlantic Groupe / Cozytouch account credentials.
    These are the same credentials you use for the Cozytouch mobile app.
  </p>

  <div class="form-group">
    <label for="username">Email</label>
    <input type="text" id="username" placeholder="your@email.com" autocomplete="email" />
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
  </div>

  <div>
    <button class="btn-save" id="btn-save">Save</button>
    <button class="btn-test" id="btn-test">Test Connection</button>
  </div>

  <div class="status" id="status"></div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready();

      var usernameEl = document.getElementById('username');
      var passwordEl = document.getElementById('password');
      var statusEl = document.getElementById('status');

      // Load existing credentials
      Homey.get('username', function(err, value) {
        if (!err && value) usernameEl.value = value;
      });
      Homey.get('password', function(err, value) {
        if (!err && value) passwordEl.value = value;
      });

      function setStatus(message, type) {
        statusEl.className = 'status ' + type;
        statusEl.textContent = message;
      }

      document.getElementById('btn-save').addEventListener('click', function() {
        var username = usernameEl.value.trim();
        var password = passwordEl.value.trim();

        if (!username || !password) {
          setStatus('Please enter both email and password.', 'error');
          return;
        }

        Homey.set('username', username, function(err) {
          if (err) {
            setStatus('Failed to save email: ' + err.message, 'error');
            return;
          }
          Homey.set('password', password, function(err2) {
            if (err2) {
              setStatus('Failed to save password: ' + err2.message, 'error');
              return;
            }
            setStatus('Credentials saved successfully.', 'success');
          });
        });
      });

      document.getElementById('btn-test').addEventListener('click', function() {
        var username = usernameEl.value.trim();
        var password = passwordEl.value.trim();

        if (!username || !password) {
          setStatus('Please enter both email and password.', 'error');
          return;
        }

        setStatus('Testing connection...', 'loading');

        Homey.api('POST', '/test-credentials', { username: username, password: password }, function(err, result) {
          if (err) {
            setStatus('Connection failed: ' + (err.message || err), 'error');
          } else {
            setStatus('Connection successful! Found ' + result.deviceCount + ' device(s).', 'success');
          }
        });
      });
    }
  </script>
</body>
</html>
